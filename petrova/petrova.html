<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница о человеке</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Компактная серая плашка */
    .timer-box {
      background: #eef2f5;
      padding: 10px 20px;
      border-radius: 28px;
      margin: 20px auto;
      max-width: 280px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      transition: all 0.3s ease;
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }
    
    /* Цитата без овала */
    .Quote {
      margin: 20px auto;
      max-width: 450px;
      text-align: center;
    }
    
    .Quote p {
      margin: 0;
      font-style: italic;
      color: #6b7a8a;
    }
  </style>
</head>
<body>

<header>
  <a href="#">Петрова Ирина</a>
  <a href="../index.html">Назад</a>
</header>

<section class="profile">
  <img src="photo/petrova.jpg" alt="Фото человека">
  <h1>Петрова Ирина</h1>
  <p><strong>Люблю фильмы, собачек и ТикТок ✨. В свободное время хожу на каратэ и учу английский.</strong></p>
  
  <div class="Quote">  
    <p><em>"Возьми телефон, детка. Я знаю, ты хочешь позвонить...📲"</em></p>
  </div>

  <div class="hobbies">
    <h2>Мои увлечения</h2>
    <ul>
      <li>🇬🇧 Английский</li>
      <li>🐕 Кинология</li>
      <li>🥋 Каратэ</li>
    </ul>
  </div>
</section>

<footer>
  Сделано с кайфом 😎 | 2026
</footer>

</script>

</body>
</html>
